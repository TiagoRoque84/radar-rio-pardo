name: Testar Radar Rio Pardo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar banco local SQLite para testes
        run: |
          npm run db:use-sqlite
          npx prisma generate
          npx prisma db push
          npm run db:seed
        env:
          DATABASE_URL: file:./dev.db
          NODE_ENV: test
      - name: Testes automatizados
        run: npm test
        env:
          DATABASE_URL: file:./dev.db
          NODE_ENV: test
      - name: Verificar TypeScript e build MySQL
        run: |
          npm run db:use-mysql
          npx prisma generate
          npm run typecheck
          npm run build
        env:
          DATABASE_URL: file:./dev.db
          NODE_ENV: test
