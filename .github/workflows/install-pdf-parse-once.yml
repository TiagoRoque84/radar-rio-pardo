name: Instalar leitor de PDF (uma vez, somente branch de testes)

on:
  push:
    branches:
      - feature/diario-oficial-atos-estruturados
    paths:
      - .github/workflows/install-pdf-parse-once.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolver pacote e lockfile
        run: |
          npm ci --no-audit --no-fund
          npm install pdf-parse@2.4.5 --save-exact --no-audit --no-fund
          node -e "const p = require('./package.json'); if(p.dependencies['pdf-parse'] !== '2.4.5') process.exit(1)"
      - name: Gravar somente dependências na branch de testes
        env:
          EXPECTED_BRANCH: feature/diario-oficial-atos-estruturados
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(diario): pin pdf-parse 2.4.5 and lock dependencies"
          git push origin "HEAD:$EXPECTED_BRANCH"
