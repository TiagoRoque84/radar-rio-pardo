name: Testar Radar Rio Pardo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: radar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar banco local SQLite para testes
        run: |
          npm run db:use-sqlite
          npx prisma generate
          npx prisma db push
          npm run db:seed
        env:
          DATABASE_URL: file:./dev.db
          NODE_ENV: test
      - name: Testes automatizados (SQLite)
        run: npm test
        env:
          DATABASE_URL: file:./dev.db
          NODE_ENV: test
      - name: Preparar e testar fluxo editorial/coletor em MySQL 8.0 de testes
        run: |
          npm run db:use-mysql
          npx prisma generate
          npx tsx scripts/init-db-if-needed.ts
          npm run db:seed
          npx vitest run tests/diario-oficial-isolated-import.test.ts tests/database-integration.test.ts tests/pncp-and-csrf-audit.test.ts tests/auth-and-editorial.test.ts
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/radar_test
          NODE_ENV: test
          SEED_ADMIN_EMAIL: admin@radarriopardo.com.br
          SEED_ADMIN_PASSWORD: RioPardoCiTest!2026#Admin
      - name: Verificar TypeScript e build MySQL
        run: |
          npm run db:use-mysql
          npx prisma generate
          npm run typecheck
          # O Google Fonts às vezes devolve URLs sem extensão; o next/font
          # pode falhar na CI com "Cannot read properties of null (reading '1')".
          # Repetir SOMENTE essa falha transitória, sem esconder erros de código.
          for attempt in 1 2 3; do
            if npm run build > /tmp/radar-build.log 2>&1; then
              cat /tmp/radar-build.log
              exit 0
            fi
            cat /tmp/radar-build.log
            if ! grep -q 'next/font' /tmp/radar-build.log ||
               ! grep -q "Cannot read properties of null (reading '1')" /tmp/radar-build.log ||
               [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "next/font externo apresentou resposta incompatível; nova tentativa $((attempt + 1))/3"
            sleep 2
          done
        env:
          DATABASE_URL: file:./dev.db
          NODE_ENV: test
